# Stage 2 – Hypergredient Primitive Refinement Workflow
#
# This workflow:
#   1. Calls the reusable generation workflow to obtain fresh raw primitives.
#   2. Downloads the raw artifact.
#   3. Runs refine_primitives.py to enrich primitives with AI scoring.
#   4. Runs validate_primitives.py (full validation including scored stage).
#   5. Uploads the refined + scored tree as `metop-hyping-primitives-refined`.
#
# Trigger modes:
#   - workflow_dispatch  – manual run with optional dry-run toggle
#   - schedule           – nightly at 02:00 UTC
#   - workflow_run       – automatically after the generation workflow completes

name: "Hypergredient Primitives – Stage 2: Refine"

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry-run only (no files written)"
        required: false
        type: boolean
        default: false
      python_version:
        description: "Python version"
        required: false
        type: string
        default: "3.10"
      artifact_retention_days:
        description: "Days to retain the refined artifact"
        required: false
        type: number
        default: 7

  schedule:
    # Nightly at 02:00 UTC
    - cron: "0 2 * * *"

  workflow_run:
    workflows: ["[Reusable] Generate Hypergredient Primitives"]
    types:
      - completed

permissions:
  contents: read
  actions: read

concurrency:
  group: hypergredient-primitives-refine-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Stage 1 – generate raw primitives (reusable workflow)
  # ---------------------------------------------------------------------------
  generate:
    name: "Stage 1: Generate Raw Primitives"
    uses: ./.github/workflows/reusable_hypergredient_primitives.yml
    with:
      python_version: ${{ inputs.python_version || '3.10' }}
      output_root: metop
      dry_run: ${{ inputs.dry_run || false }}
      artifact_retention_days: ${{ inputs.artifact_retention_days || 7 }}

  # ---------------------------------------------------------------------------
  # Stage 2 – refine
  # ---------------------------------------------------------------------------
  refine:
    name: "Stage 2: Refine Primitives"
    needs: generate
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # 2. Python
      - name: Set up Python ${{ inputs.python_version || '3.10' }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python_version || '3.10' }}

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip

      # 3. Download raw primitives artifact from Stage 1
      - name: Download raw primitives artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.generate.outputs.artifact_name }}
          path: metop/

      # 4. Refine
      - name: Refine hypergredient primitives (Stage 2)
        id: refine
        working-directory: examples/python
        run: |
          python refine_primitives.py \
            --output-root "${{ github.workspace }}/metop" \
            | tee /tmp/refine_output.txt

          TOTAL=$(grep -oP '(?<=Done – )\d+' /tmp/refine_output.txt || echo "0")
          echo "total_refined=${TOTAL}" >> "$GITHUB_OUTPUT"

      # 5. Full validation (includes scored stage)
      - name: Validate refined + scored primitives
        working-directory: examples/python
        run: |
          python validate_primitives.py \
            --output-root "${{ github.workspace }}/metop"

      # 6. Run pipeline-specific test suite
      - name: Run primitives pipeline tests
        working-directory: examples/python
        run: python -m unittest test_primitives_pipeline -v

      # 7. Job summary
      - name: Write job summary
        if: always()
        run: |
          {
            echo "## 🔮 Hypergredient Primitive Refinement – Stage 2: refined + scored"
            echo ""
            echo "| Property | Value |"
            echo "|---|---|"
            echo "| Primitives refined | \`${{ steps.refine.outputs.total_refined }}\` |"
            echo "| Run | [\`${{ github.run_id }}\`](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |"
          } >> "$GITHUB_STEP_SUMMARY"

      # 8. Upload refined artifact
      - name: Upload refined + scored primitives artifact
        uses: actions/upload-artifact@v4
        with:
          name: metop-hyping-primitives-refined
          path: metop/
          if-no-files-found: error
          retention-days: ${{ inputs.artifact_retention_days || 7 }}
